name: cosmus
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.8
  audioplayers: 6.7.1
  flutter_launcher_icons: ^0.14.4
  url_launcher: ^6.3.2
  shared_preferences: ^2.2.2

  sqflite: ^2.4.2
  path: ^1.9.1
  bcrypt: ^1.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#0B0E14"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/planetas/
    - assets/sonido_cosmos/
    - assets/audios/
    - assets/images/
    - assets/imagenes/
    - assets/decoraciones/
    - assets/galeria/
    - assets/url/